[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chat-topic-bucketer"
version = "0.2.0"
description = "Bucket conversation topics across any AI assistant's chats — a living topic index with map and digest commands"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ai", "assistant", "topics", "chat", "mcp", "agent-skill"]

[project.scripts]
bucketer = "cli:main"

[project.optional-dependencies]
mcp = ["mcp>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.hatch.build.targets.wheel.force-include]
"cli.py" = "cli.py"
